name: POPO stage 3 chart candidate checks

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'prototype/calc-core.js'
      - 'prototype/vendor/lunar.min.js'
      - 'tests/chart-bridge.integration.cjs'
      - '.github/workflows/chart-probe-stage3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out POPO
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline API test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Test FastAPI local-only contract
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Test pinned lunar engine through Node bridge
        run: node tests/chart-bridge.integration.cjs
